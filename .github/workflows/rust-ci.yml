name: Rust CI

# pre-PR/merge CI. The reusable gates (fmt/clippy/tests, plugin manifests,
# differential harness, native platform runtime/TLS gates) live in
# rust-gates.yml so release.yml runs the same copy before publishing; this
# workflow adds the host-target packaging test, which is a fast sanity check and
# not a release gate. The six-target release packaging lives in
# release-package.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates
    uses: ./.github/workflows/rust-gates.yml
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  # Packaging test (Task 29A).
  #
  # Builds and packages the host target only, then asserts the archive name and
  # entries. It runs after the gates and only when packaging inputs changed, so
  # a fat-LTO release build does not run for unrelated PRs. GitHub only supports
  # `paths:` at workflow level and this workflow must keep running the gates on
  # every PR, so the small `changes` job computes the filter with git diff.
  #
  # The six-target release dry run lives in rust-release-dry-run.yml, backed by
  # release-package.yml; performance smoke (scripts/perf-smoke.sh and
  # docs/release/perf-results.md) is Task 29B and is not wired here.
  # ---------------------------------------------------------------------------
  changes:
    name: packaging input changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package: ${{ steps.filter.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect packaging input changes
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "package=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}"
          if ! changed=$(git diff --name-only "$base"...HEAD); then
            echo "::warning::could not diff against $base; running the packaging test"
            echo "package=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | awk '
            /^src\// { found = 1 }
            /^README\.md$/ { found = 1 }
            /^config\.example\.toml$/ { found = 1 }
            /^Cargo\.toml$/ { found = 1 }
            /^Cargo\.lock$/ { found = 1 }
            /^rust-toolchain\.toml$/ { found = 1 }
            /^scripts\/package-rust-release\.sh$/ { found = 1 }
            /^\.github\/workflows\/rust-ci\.yml$/ { found = 1 }
            /^\.github\/workflows\/release-package\.yml$/ { found = 1 }
            END { exit found ? 0 : 1 }
          '; then
            echo "package=true" >> "$GITHUB_OUTPUT"
          else
            echo "package=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: package (linux x86_64 host)
    needs: [gates, changes]
    if: ${{ needs.changes.outputs.package == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy

      - name: Package host target
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          test -n "$version"
          bash scripts/package-rust-release.sh --version "$version" \
            --target x86_64-unknown-linux-gnu --out target/package-test

      - name: Assert archive name and contents
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          archive="target/package-test/subagent-mcp_${version}_linux_amd64.tar.gz"
          test -s "$archive"
          diff -u <(printf 'README.md\nconfig.example.toml\nsubagent-mcp\n' | LC_ALL=C sort) \
            <(tar -tzf "$archive" | LC_ALL=C sort)

      - uses: actions/upload-artifact@v4
        with:
          name: rust-package-host
          path: target/package-test/subagent-mcp_*
          if-no-files-found: error
