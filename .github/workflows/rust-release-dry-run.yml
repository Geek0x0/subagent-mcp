name: Rust Release Dry Run

# Dry run only. Calls release-package.yml (shared with release.yml) for the
# six-target matrix, packaging, checksums and the Windows arm64 provenance gate.
# It never creates a tag or a GitHub release and never updates
# scripts/release.lock or the plugin pin.
#
# Windows arm64 runs natively on the GitHub-hosted windows-11-arm runner. That
# label is a preview, so arm64 is optional on pull_request and a missing arm64
# archive is a warning instead of a failure. On workflow_dispatch arm64 is a
# required gate. If the label is unavailable, re-run with
# windows_arm64_fallback=true; the cross-built archive is never acceptance
# evidence and the reusable workflow fails the run until the checklist in
# docs/release/windows-arm64-evidence.md is completed.

on:
  workflow_dispatch:
    inputs:
      windows_arm64_fallback:
        description: "Build Windows arm64 with cargo-xwin (requires Windows arm64 VM evidence)"
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/rust-release-dry-run.yml"
      - ".github/workflows/release-package.yml"
      - "scripts/package-rust-release.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"

permissions:
  contents: read

jobs:
  package:
    name: package (six targets + checksums)
    uses: ./.github/workflows/release-package.yml
    permissions:
      contents: read
    with:
      mode: dry-run
      # A dispatch is a release gate; a pull_request may be missing arm64.
      arm64: ${{ github.event_name == 'pull_request' && 'optional' || 'required' }}
      arm64_fallback: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_arm64_fallback == true }}
