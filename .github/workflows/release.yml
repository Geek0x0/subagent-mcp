name: Release

# Publishing workflow for the Rust-only 0.14.0 release.
#
# A tag push is the only trigger. The package job calls release-package.yml,
# which packages each target exactly once with scripts/package-rust-release.sh,
# downloads those archives (never rebuilds) and writes checksums.txt; the
# publish job creates a new GitHub release and uploads that same set. It fails
# if the release already exists, so a rerun cannot silently replace archives or
# checksums.
#
# The runtime-gates job calls rust-gates.yml, the same reusable gate set rust-ci
# runs, including native Linux/macOS/Windows runtime and TLS trust tests.
# Publishing is blocked on it.
#
# The last job, sync-plugin-versions, runs only after publish and pins the plugin
# manifests and scripts/release.lock to the tag, then pushes that to main.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: verify tag and version sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check Cargo.toml, VERSION, and tag agree
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          lib_version=$(sed -n 's/^pub const VERSION: &str = "\(.*\)";$/\1/p' src/lib.rs)
          test -n "$version"
          test "$version" = "$lib_version"
          test "v$version" = "$GITHUB_REF_NAME"
          printf 'version=%s tag=%s\n' "$version" "$GITHUB_REF_NAME"

  runtime-gates:
    name: native runtime and TLS gates
    uses: ./.github/workflows/rust-gates.yml
    permissions:
      contents: read

  # Six-target packaging plus checksums, shared with the dry-run workflow so
  # the matrices cannot drift. mode=publish keeps the release assets to the six
  # archives and checksums.txt; a cargo-xwin fallback is rejected by the
  # reusable workflow and never runs here.
  package:
    name: package (six targets + checksums)
    needs: [verify-version]
    uses: ./.github/workflows/release-package.yml
    permissions:
      contents: read
    with:
      mode: publish
      arm64: required

  publish:
    name: publish GitHub release
    needs: [runtime-gates, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Publish once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME already exists; refusing to replace archives/checksums"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes

  # Keep the Claude/Codex plugin manifests and the launcher's release lock in
  # step with the published tag. Runs only after everything above succeeded
  # (publish needs the whole chain, and the lock needs the published
  # checksums.txt). Pushing to main cannot re-trigger this workflow: it listens
  # to tag pushes.
  sync-plugin-versions:
    name: sync plugin manifests and release lock
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set versions from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          test -n "$version"
          python3 - "$version" <<'PY'
          import json
          import pathlib
          import sys

          version = sys.argv[1]
          changed = []
          for name in (".claude-plugin/plugin.json", ".codex-plugin/plugin.json"):
              path = pathlib.Path(name)
              data = json.loads(path.read_text(encoding="utf-8"))
              if data.get("version") == version:
                  continue
              data["version"] = version
              path.write_text(
                  json.dumps(data, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
              changed.append(name)
          print("changed: " + (", ".join(changed) if changed else "(none)"))
          PY

      # The launcher pins the binary it downloads in scripts/release.lock, not
      # in the manifests, so a tag without this step keeps serving the old
      # binary. The script reads the release's checksums.txt, so it can only run
      # after publish.
      - name: Pin release lock to the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          test -n "$version"
          sh scripts/update-release-lock.sh "$version"

      - name: Commit and push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          if git diff --quiet; then
            echo "manifests and release lock already at $version; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json .codex-plugin/plugin.json scripts/release.lock
          git commit -m "chore: sync plugin manifests and release lock to v$version"
          if ! git push origin HEAD:main; then
            echo "push rejected; rebasing on main and retrying once"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
